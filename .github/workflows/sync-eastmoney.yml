# 东方财富模拟组合「翻81681」自动同步（trading-review-console 迁移版）
# ---------------------------------------------------------------
# 说明：定时运行 sync_eastmoney.py + gen_ledger.py，从东财接口拉取最新组合数据，
#       写入 live-snapshot.json，把当日净值追加进 data/equity_history.json，
#       重建 data/ledger.json（含逐日收益日历 equity_points / daily_calendar），
#       并推送到仓库（GitHub Pages 随即更新）。
#       收益日历按天推进依靠「每日执行、当日权威总资产追加进 equity_history」，
#       因此每天必须跑一次；勿长期关闭 cron。
name: 同步东财模拟盘

on:
  # 定时同步：工作日每天收盘后（30分 7时 UTC = 北京时间 15:30）跑一次
  schedule:
    - cron: "30 7 * * 1-5"
  # 手动触发
  workflow_dispatch:
    inputs:
      push:
        description: "是否将结果推送到仓库(pages)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行东财同步脚本
        run: |
          python sync_eastmoney.py \
            --out /tmp/live-full.json \
            --snap-dir .

      - name: 追加当日净值到 equity_history + 重建账本
        run: |
          python - <<'PY'
          import json,os
          snap=json.load(open('live-snapshot.json',encoding='utf-8'))
          day=snap['synced_at'][:10]
          total=float(snap['account']['total_assets'])
          hist='data/equity_history.json'
          h=json.load(open(hist,encoding='utf-8')) if os.path.exists(hist) else []
          ds={p['date'] for p in h}
          if day not in ds:
              h.append({"date":day,"close":round(total,2),"source":"authority(东财)"})
              h.sort(key=lambda x:x['date'])
              json.dump(h,open(hist,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
              print('追加',day,total)
          else:
              # 同一天重复跑：仅刷新为当时权威 total
              for p in h:
                  if p['date']==day: p['close']=round(total,2)
              json.dump(h,open(hist,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
              print('刷新',day,total)
          PY
          python gen_ledger.py

      - name: 展示同步结果
        run: |
          echo "== 同步摘录 =="
          python -c "import json;d=json.load(open('live-snapshot.json'));a=d['account'];print('同步时间',d['synced_at']);print('总资产',a['total_assets']);print('收益率%',a['total_return_pct']);print('持仓数',len(d['positions']));print('调仓数',d['trade_count'])"
          python -c "import json;l=json.load(open('data/ledger.json'));ep=l['equity_points'];print('收益日历点数',len(ep),'末点',ep[-1]['date'],ep[-1]['close'])"

      - name: 提交并推送快照
        if: github.event.inputs.push != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-snapshot.json data/equity_history.json data/ledger.json
          git diff --cached --quiet && echo "无变化" || { git commit -m "chore(自动): 同步东财模拟盘+账本 $(date +%F)"; git push; }