<!-- Generated by Trae Work — 美股复盘(动态) 只显示近期7天 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>美股复盘 · 动态</title>
<style>
@font-face { font-family:'InstrumentSans'; src:url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype'); font-weight:400; }
@font-face { font-family:'InstrumentSans'; src:url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'JetBrainsMono'; src:url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype'); font-weight:400; }
:root{
  --bg:#f4f2ec; --bg2:#ffffff; --bg3:#edebe3; --ink:#2c3b39; --muted:#73817e;
  --rule:#e0e5e2; --accent:#0e9c8e; --accent2:#159a6f; --green:#128a55; --red:#d1584f; --warn:#bf8b12; --max-w:920px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'InstrumentSans',sans-serif; color:var(--ink); font-size:16px; line-height:1.7; background:var(--bg);
  background:radial-gradient(1100px 550px at 75% -10%,rgba(14,156,142,.05),transparent 60%),radial-gradient(900px 480px at 10% 110%,rgba(21,154,111,.04),transparent 60%),var(--bg);
  background-attachment:fixed;
}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.container{max-width:var(--max-w);margin:0 auto;padding:0 24px;padding-bottom:60px}
header{padding:48px 0 26px;border-bottom:1px solid var(--rule);margin-bottom:22px}
header h1{font-family:'JetBrainsMono',monospace;font-size:1.9rem;font-weight:700;color:var(--ink);letter-spacing:.01em}
header h1 .dot{color:var(--accent)}
.subtitle{color:var(--muted);margin-top:6px;font-size:.95rem}
.meta{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;align-items:center}
.meta .stamp{font-size:.8rem;color:var(--muted);font-family:'JetBrainsMono',monospace}
/* window toggle */
.window{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.win-btn{border:1px solid var(--rule);background:var(--bg2);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;transition:.15s;font-family:'InstrumentSans',sans-serif}
.win-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.arch-note{width:100%;font-size:.78rem;color:var(--muted);margin-top:4px}
/* report card */
.card{background:rgba(255,255,255,.75);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;margin-bottom:16px;backdrop-filter:blur(6px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer}
.chev{color:var(--accent);transition:transform .2s;font-family:'JetBrainsMono',monospace}
.card.open .chev{transform:rotate(90deg)}
.card-date{font-family:'JetBrainsMono',monospace;font-size:.78rem;color:var(--accent);letter-spacing:.02em}
.card-title{font-weight:700;font-size:1.1rem;margin:4px 0 6px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.tag{font-size:.7rem;padding:2px 9px;border-radius:11px;background:var(--accent)+'1a';color:var(--accent);font-weight:600}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0 12px}
.kpi{background:var(--bg2);border:1px solid var(--rule);border-radius:10px;padding:9px 12px;text-align:center}
.kpi .v{font-family:'JetBrainsMono',monospace;font-size:1.05rem;font-weight:700}
.kpi .v.up{color:var(--green)}.kpi .v.down{color:var(--red)}
.kpi .l{font-size:.7rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.kpi .c{font-family:'JetBrainsMono',monospace;font-size:.78rem;margin-top:1px}
.body{display:none;border-top:1px dashed var(--rule);margin-top:14px;padding-top:14px}
.card.open .body{display:block}
.field{margin-bottom:11px;font-size:.92rem}
.field .fl{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.state{background:var(--bg3);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:11px;font-size:.9rem}
.bb{border-left:3px solid var(--green);padding-left:11px;margin-bottom:9px;font-size:.9rem}
.br{border-left:3px solid var(--red);padding-left:11px;margin-bottom:9px;font-size:.9rem}
.bv{border-left:3px solid var(--accent);padding-left:11px;font-size:.9rem}
.open-btn{display:inline-block;margin-top:4px;background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:9px;font-size:.82rem;cursor:pointer;font-family:'InstrumentSans',sans-serif}
.open-btn:hover{opacity:.9}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-size:.95rem}
/* footer back */
.back{margin-top:26px;text-align:right}
.back a{color:var(--accent);text-decoration:none;font-size:.85rem}
@media(max-width:600px){header h1{font-size:1.5rem}.container{padding:0 16px}.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>美股复盘 <span class="dot">·</span> 动态</h1>
  <div class="subtitle">从 <span id="src-info">data/us-reviews.json</span> 驱动 · 默认只显示最近 7 天的复盘 · 超出的自动归档折叠</div>
  <div class="meta"><span class="stamp" id="upd">loading…</span><span class="stamp" id="count"></span></div>
</header>

<div class="window">
  <button class="win-btn active" data-w="7">近 7 天</button>
  <button class="win-btn" data-w="all">全部</button>
  <div class="arch-note">数据过期时可强刷(<b>Ctrl/Cmd+Shift+R</b>)，数据源是脚本/AI 写回后直接 push 到这个仓库。</div>
</div>

<div id="list"></div>
<footer class="back"><a href="../trading-console-0808.html">← 返回复盘总览</a></footer>
</div>

<script>
(function(){
  var listEl = document.getElementById('list');
  var updEl = document.getElementById('upd');
  var cntEl = document.getElementById('count');
  var win = '7';
  var reports = [];

  function fmtChg(v){
    if(v==null) return '';
    v = String(v);
    var num = parseFloat(v);
    var cls = (isNaN(num)||num==0)?'': (num>0?'up':'down');
    return {txt:v, cls:cls};
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

  function kpiHTML(r){
    var arr = r.indices || r.kpis2 || [];
    var kp = r.kpis;
    if(kp){ // fallback: {spx,ndx,dji,vix}
      arr = [
        {name:'S&P 500', chg:kp.spx},{name:'纳斯达克', chg:kp.ndx},{name:'道琼斯', chg:kp.dji},{name:'VIX', chg:kp.vix}
      ];
    }
    return '<div class="kpi-row">'+ arr.map(function(k){
      var v = fmtChg(k.chg||'');
      return '<div class="kpi"><div class="v '+v.cls+'">'+esc(k.val||'')+'</div>'+
        '<div class="l">'+esc(k.name)+'</div><div class="c">'+ (k.num!=null ? '<span>'+(k.num>0?'▲':'▼')+' </span>':'') +esc(v.txt)+'</div></div>';
    }).join('') +'</div>';
  }

  function cardHTML(r){
    var body = [
      r.summary? '<p class="field">'+esc(r.summary)+'</p>':'',
      r.state? '<div class="state">🟤 当期状态：'+esc(r.state)+'</div>':'',
      r.trigger? '<p class="field"><span class="fl">触发器</span><br>'+esc(r.trigger)+'</p>':'',
      r.mainline? '<p class="field"><span class="fl">主线与资金</span><br>'+esc(r.mainline)+'</p>':'',
      r.bull? '<p class="bb"><strong>🐂 多头：</strong>'+esc(r.bull)+'</p>':'',
      r.bear? '<p class="br"><strong>🐻 空头：</strong>'+esc(r.bear)+'</p>':'',
      r.verdict? '<p class="bv"><strong>⚖️ 综合：</strong>'+esc(r.verdict)+'</p>':'',
      r.outlook? '<p class="field"><span class="fl">前瞻</span><br>'+esc(r.outlook)+'</p>':''
    ].join('');
    var footer = r.file? '<a class="open-btn" href="'+esc(r.file)+'">打开完整深度报告 →</a>' : '';
    return '<div class="card">'+
      '<div class="card-head"><div>'+
        '<div class="card-date">'+esc(r.date)+' · '+esc(r.weekday||'')+'</div>'+
        '<div class="card-title">'+esc(r.title||r.date)+'</div>'+
        '<div class="card-tags">'+ (r.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('') +'</div>'+
      '</div><div class="chev">▸</div></div>'+
      kpiHTML(r)+
      '<div class="body">'+body+ footer +'</div>'+
    '</div>';
  }

  function isIn7days(dateStr){
    if(!dateStr) return true;
    var d = new Date(dateStr+'T00:00:00');
    if(isNaN(d)) return true;
    var now = new Date();
    now.setHours(0,0,0,0);
    return (now - d) <= 6*86400000;
  }

  function render(){
    var sorted = reports.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
    var shown = (win==='7') ? sorted.filter(function(r){return isIn7days(r.date);}) : sorted;
    var has7 = shown.length>0;
    var final = shown;
    if(!has7){ // 近7天内无新报告：展示最近的1篇，并标注已归档
      final = sorted.slice(0,1);
      listEl.innerHTML = final.map(cardHTML).join('') +
        '<div class="arch-note">近 7 天暂无新报告，以上为最新归档报告。数据过期可在控制台触发美股复盘流程生成新报告。</div>';
      bind(final);
      return;
    }
    var hidden = sorted.length - shown.length;
    listEl.innerHTML = final.map(cardHTML).join('') +
      (hidden>0? '<div class="arch-note">已折叠 '+hidden+' 篇更早报告（仅显示近 7 天）。点「全部」可查看。</div>':'');
    bind(final);
  }

  function bind(rows){
    document.querySelectorAll('.card').forEach(function(c,i){
      var head = c.querySelector('.card-head');
      head.addEventListener('click', function(){ c.classList.toggle('open'); });
    });
  }

  document.querySelectorAll('.win-btn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.win-btn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); win = b.getAttribute('data-w'); render();
    });
  });

  fetch('data/us-reviews.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){
      reports = (j&&j.reports)||[];
      updEl.textContent = '数据更新于 '+(j.updated_at||'—');
      cntEl.textContent = '共 '+reports.length+' 篇';
      render();
    })
    .catch(function(e){
      listEl.innerHTML = '<div class="empty">美股复盘数据加载失败。<br>请确认 <b>data/us-reviews.json</b> 存在且为合法 JSON。<br><span style="font-size:.8rem">'+esc(e&&e.message)+'</span></div>';
    });
})();
</script>
</body>
</html>
